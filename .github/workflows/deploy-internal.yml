name: Deploy to Internal Testing

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]

jobs:
  verify:
    name: Run tests before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup local config (placeholders — unit tests never need real keys)
        run: |
          cat > local.properties <<'EOF'
          GITHUB_CLIENT_ID=ci-placeholder
          GITHUB_CLIENT_SECRET=ci-placeholder
          GOOGLE_WEB_CLIENT_ID=ci-placeholder.apps.googleusercontent.com
          NEXUS_BACKEND_URL=https://api.nexusapp.in/v1
          OPENROUTER_API_KEY=
          AI_PROXY_URL=
          sdk.dir=$ANDROID_HOME
          EOF
          if [ ! -f app/google-services.json ]; then
            cp app/google-services.json.template app/google-services.json
          fi
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

  deploy:
    name: Deploy to Play Store Internal Track
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          NEXUS_BACKEND_URL=${{ secrets.NEXUS_BACKEND_URL }}
          AI_PROXY_URL=${{ secrets.AI_PROXY_URL }}
          KEYSTORE_PATH=keystore.jks
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}
          sdk.dir=$ANDROID_HOME
          EOF
          if [ ! -f app/google-services.json ]; then
            cp app/google-services.json.template app/google-services.json
          fi

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build release bundle (AAB)
        run: ./gradlew bundleRelease

      - name: Deploy to Internal Testing
        uses: r0adkll/upload-google-play@v2
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.nexus.app
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          inAppUpdatePriority: 2
