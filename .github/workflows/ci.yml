name: NEXUS CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Create local.properties
        run: |
          echo "GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}" > local.properties
          echo "GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> local.properties
          echo "NEXUS_BACKEND_URL=${{ secrets.NEXUS_BACKEND_URL }}" >> local.properties
          echo "LEETCODE_API_URL=https://alfa-leetcode-api.onrender.com/" >> local.properties
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> local.properties
          echo "AI_PROXY_URL=${{ secrets.AI_PROXY_URL }}" >> local.properties
      - name: Run lint
        run: ./gradlew lintDebug --no-daemon

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Create local.properties
        run: |
          echo "GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}" > local.properties
          echo "GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> local.properties
          echo "NEXUS_BACKEND_URL=${{ secrets.NEXUS_BACKEND_URL }}" >> local.properties
          echo "LEETCODE_API_URL=https://alfa-leetcode-api.onrender.com/" >> local.properties
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> local.properties
          echo "AI_PROXY_URL=${{ secrets.AI_PROXY_URL }}" >> local.properties
      - name: Run tests
        run: ./gradlew testDebugUnitTest --no-daemon

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Create local.properties
        run: |
          echo "GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}" > local.properties
          echo "GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> local.properties
          echo "NEXUS_BACKEND_URL=${{ secrets.NEXUS_BACKEND_URL }}" >> local.properties
          echo "LEETCODE_API_URL=https://alfa-leetcode-api.onrender.com/" >> local.properties
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> local.properties
          echo "AI_PROXY_URL=${{ secrets.AI_PROXY_URL }}" >> local.properties
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run dependency check
        run: ./gradlew dependencyCheckAnalyze --no-daemon || true

  release-build:
    name: Release Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Create local.properties
        run: |
          echo "GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}" > local.properties
          echo "GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> local.properties
          echo "NEXUS_BACKEND_URL=${{ secrets.NEXUS_BACKEND_URL }}" >> local.properties
          echo "LEETCODE_API_URL=https://alfa-leetcode-api.onrender.com/" >> local.properties
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> local.properties
          echo "AI_PROXY_URL=${{ secrets.AI_PROXY_URL }}" >> local.properties
          echo "KEYSTORE_PATH=${{ secrets.KEYSTORE_PATH }}" >> local.properties
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> local.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> local.properties
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-release-apk
          path: app/build/outputs/apk/release/*.apk
