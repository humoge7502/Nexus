name: NEXUS CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/functions/package.json
      - name: Install & typecheck
        working-directory: backend/functions
        run: |
          npm ci
          npm run typecheck

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Setup local config (no real secrets in debug path)
        run: |
          # Placeholder values only — debug artifacts must never contain
          # real API keys. Real secrets are used exclusively by the
          # release-build job below.
          cat > local.properties <<'EOF'
          GITHUB_CLIENT_ID=ci-placeholder
          GITHUB_CLIENT_SECRET=ci-placeholder
          GOOGLE_WEB_CLIENT_ID=ci-placeholder.apps.googleusercontent.com
          NEXUS_BACKEND_URL=https://api.nexusapp.in/v1
          LEETCODE_API_URL=https://alfa-leetcode-api.onrender.com/
          OPENROUTER_API_KEY=
          AI_PROXY_URL=
          EOF
          if [ ! -f app/google-services.json ]; then
            cp app/google-services.json.template app/google-services.json
          fi
      - name: Run lint
        run: ./gradlew lintDebug --no-daemon

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Setup local config (no real secrets in debug path)
        run: |
          cat > local.properties <<'EOF'
          GITHUB_CLIENT_ID=ci-placeholder
          GITHUB_CLIENT_SECRET=ci-placeholder
          GOOGLE_WEB_CLIENT_ID=ci-placeholder.apps.googleusercontent.com
          NEXUS_BACKEND_URL=https://api.nexusapp.in/v1
          LEETCODE_API_URL=https://alfa-leetcode-api.onrender.com/
          OPENROUTER_API_KEY=
          AI_PROXY_URL=
          EOF
          if [ ! -f app/google-services.json ]; then
            cp app/google-services.json.template app/google-services.json
          fi
      - name: Run tests
        run: ./gradlew testDebugUnitTest --no-daemon

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Setup local config (no real secrets in debug path)
        run: |
          cat > local.properties <<'EOF'
          GITHUB_CLIENT_ID=ci-placeholder
          GITHUB_CLIENT_SECRET=ci-placeholder
          GOOGLE_WEB_CLIENT_ID=ci-placeholder.apps.googleusercontent.com
          NEXUS_BACKEND_URL=https://api.nexusapp.in/v1
          LEETCODE_API_URL=https://alfa-leetcode-api.onrender.com/
          OPENROUTER_API_KEY=
          AI_PROXY_URL=
          EOF
          if [ ! -f app/google-services.json ]; then
            cp app/google-services.json.template app/google-services.json
          fi
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-build:
    name: Release Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          NEXUS_BACKEND_URL=${{ secrets.NEXUS_BACKEND_URL }}
          LEETCODE_API_URL=https://alfa-leetcode-api.onrender.com/
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          AI_PROXY_URL=${{ secrets.AI_PROXY_URL }}
          KEYSTORE_PATH=${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF
          if [ ! -f app/google-services.json ]; then
            cp app/google-services.json.template app/google-services.json
          fi
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
