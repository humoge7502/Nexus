version: 2
updates:
  # Android / Kotlin dependencies (single source of truth: libs.versions.toml)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      compose:
        patterns: ["androidx.compose*"]
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]

  # Backend Cloud Functions
  - package-ecosystem: "npm"
    directory: "/backend/functions"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # Python ML pipeline and scraper
  - package-ecosystem: "pip"
    directory: "/ml/placement_readiness"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "pip"
    directory: "/scripts/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # CI actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
