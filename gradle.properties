android.useAndroidX=true
kotlin.code.style=official
# 2g heap: the committed hs_err logs show the previous -Xmx4g setting caused
# native OOM crashes on an 8-core / 7GB RAM machine (Gradle daemon + Kotlin
# daemon + KSP together). Raise only on machines with >= 16GB RAM.
org.gradle.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# 1g OOM'd the Kotlin daemon during the full non-incremental release
# compile of the 47-file instrument-UI changeset; 2.5g fits the 7GB RAM
# budget alongside the 3g Gradle daemon (previous 4g experiment caused
# native OOM — see comment above).
kotlin.daemon.jvmargs=-Xmx2500m

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
