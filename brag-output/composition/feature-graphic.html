<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ascent Feature Graphic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1024px; height: 500px; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  .stage {
    position: relative; width: 1024px; height: 500px; overflow: hidden;
    background: linear-gradient(115deg, #101c46 0%, #1d4fd8 55%, #2fb9f0 100%);
    display: flex; align-items: center;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 52px 52px;
  }
  .glow {
    position: absolute; right: -120px; top: -160px; width: 520px; height: 520px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(96,205,255,0.35) 0%, transparent 65%);
  }
  .left { position: relative; padding-left: 64px; width: 640px; }
  .wordmark {
    font-size: 88px; font-weight: 800; color: #fff; letter-spacing: -0.03em;
    font-family: Georgia, "Times New Roman", serif;
  }
  .tagline { font-size: 27px; color: rgba(255,255,255,0.92); margin-top: 10px; font-weight: 500; }
  .chips { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
  .chip {
    padding: 9px 22px; border-radius: 999px; font-size: 18px; font-weight: 600;
    color: #fff; border: 1px solid rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.12);
  }
  .phone {
    position: absolute; right: 72px; top: 46px; width: 236px; height: 480px;
    border-radius: 34px; border: 7px solid #0b1220; overflow: hidden;
    background: #fff; box-shadow: 0 30px 70px rgba(5,10,30,0.45);
  }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
</style>
</head>
<body>
  <div class="stage">
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="left">
      <div class="wordmark">Ascent</div>
      <div class="tagline">Engineer Your Future</div>
      <div class="chips">
        <span class="chip">Internships</span>
        <span class="chip">Readiness score</span>
        <span class="chip">AI mentor</span>
      </div>
    </div>
    <div class="phone"><img src="assets/ui/home.png" alt="" /></div>
  </div>
</body>
</html>
